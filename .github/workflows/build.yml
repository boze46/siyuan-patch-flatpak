name: Build and publish flatpak repo

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-publish
  cancel-in-progress: false

env:
  APP_ID: io.github.MohamedElashri.SiYuan
  FORK_REPO: MohamedElashri/siyuan-patch

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check fork release and bump manifest
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api() { curl -sfL --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$@"; }

          # Authenticate: unauthenticated calls share a 60 req/h per-IP budget on
          # hosted runners and intermittently 403 (curl exit 22) mid-schedule.
          RELEASE=$(api "https://api.github.com/repos/${FORK_REPO}/releases/latest")
          LATEST_TAG=$(jq -r .tag_name <<<"$RELEASE")
          VERSION="${LATEST_TAG#v}"
          CURRENT=$(grep -m1 -oE 'siyuan-v[0-9.]+-linux\.tar\.gz' "$APP_ID.yml" | sed 's/^siyuan-v//; s/-linux\.tar\.gz$//')
          echo "fork latest: $LATEST_TAG, manifest currently: $CURRENT"

          # The fork re-publishes the same tag with rebuilt assets (release-cron),
          # so compare content hashes, not just the version number.
          LIVE_X=$(jq -r --arg n "siyuan-v${VERSION}-linux.tar.gz" '.assets[] | select(.name == $n) | .digest // ""' <<<"$RELEASE" | cut -d: -f2)
          LIVE_A=$(jq -r --arg n "siyuan-v${VERSION}-linux-arm64.tar.gz" '.assets[] | select(.name == $n) | .digest // ""' <<<"$RELEASE" | cut -d: -f2)
          CUR_X=$(sed -n 's/^        sha256: \([0-9a-f]*\)$/\1/p' "$APP_ID.yml" | sed -n 1p)
          CUR_A=$(sed -n 's/^        sha256: \([0-9a-f]*\)$/\1/p' "$APP_ID.yml" | sed -n 2p)
          PUBLISHED_AT=$(jq -r .published_at <<<"$RELEASE" | cut -dT -f1)

          if [ "$VERSION" = "$CURRENT" ] && [ "$LIVE_X" = "$CUR_X" ] && [ "$LIVE_A" = "$CUR_A" ]; then
            echo "unchanged"
            {
              echo "version=$VERSION"
              echo "changed=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$LIVE_X" ] || [ -z "$LIVE_A" ]; then
            echo "::error::could not resolve fork tarball assets for $LATEST_TAG"
            exit 1
          fi
          if ! [[ "$LIVE_X" =~ ^[0-9a-f]{64}$ ]] || ! [[ "$LIVE_A" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::fork asset digests look invalid: X=$LIVE_X A=$LIVE_A"
            exit 1
          fi

          python3 - "$VERSION" "$LIVE_X" "$LIVE_A" "$PUBLISHED_AT" <<'EOF'
          import os, re, sys

          version, sha_x, sha_a, date = sys.argv[1:5]
          app_id = os.environ["APP_ID"]

          # Rewrite the version in the tag *and* in the archive filename. Patching
          # only the tag produced download/v3.8.10/siyuan-v3.8.9-linux.tar.gz, which
          # 404s and failed every run since 3.8.10 came out.
          sha_for = {
              f"siyuan-v{version}-linux.tar.gz": sha_x,
              f"siyuan-v{version}-linux-arm64.tar.gz": sha_a,
          }
          name_re = re.compile(r"siyuan-v[\d.]+-linux(?:-arm64)?\.tar\.gz")
          tag_re = re.compile(r"(/releases/download/v)[\d.]+(/)")

          out, archive = [], None
          for line in open(f"{app_id}.yml"):
              m = name_re.search(line)
              if m:
                  archive = re.sub(r"siyuan-v[\d.]+", f"siyuan-v{version}", m.group(0))
                  line = line[:m.start()] + archive + line[m.end():]
              line = tag_re.sub(rf"\g<1>{version}\g<2>", line)
              if archive and "sha256:" in line:
                  line = re.sub(r"[0-9a-f]{64}", sha_for[archive], line)
                  archive = None
              out.append(line)
          text = "".join(out)

          for name, sha in sha_for.items():
              if f"/download/v{version}/{name}" not in text:
                  sys.exit(f"manifest rewrite failed: no url for {name}")
              if sha not in text:
                  sys.exit(f"manifest rewrite failed: sha256 for {name} not applied")
          open(f"{app_id}.yml", "w").write(text)

          meta = open(f"{app_id}.metainfo.xml").read()
          meta = re.sub(
              r'<release version="[\d.]+" date="[\d-]+">',
              f'<release version="{version}" date="{date}">', meta, count=1)
          open(f"{app_id}.metainfo.xml", "w").write(meta)
          EOF

          echo "updated manifest to v$VERSION"
          {
            echo "version=$VERSION"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Install tooling
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build app
        if: steps.check.outputs.changed == 'true'
        run: |
          flatpak-builder --user --disable-rofiles-fuse \
            --install-deps-from=flathub --force-clean \
            --repo=repo build "$APP_ID.yml"
          flatpak build-update-repo repo

      - name: Build bundle
        if: steps.check.outputs.changed == 'true'
        run: |
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/ \
            repo "siyuan-patch-${{ steps.check.outputs.version }}-x86_64.flatpak" "$APP_ID"

      - name: Commit manifest update
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update to v${{ steps.check.outputs.version }}"
          git push

      - name: Publish release bundle
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: SiYuan Patch v${{ steps.check.outputs.version }}
          files: siyuan-patch-*.flatpak
          body: Auto-built from [MohamedElashri/siyuan-patch](https://github.com/MohamedElashri/siyuan-patch) v${{ steps.check.outputs.version }}

      - name: Stage flatpak repo for Pages
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir publish
          cp -r repo publish/repo
          cat > publish/siyuan-patch.flatpakrepo <<EOF
          [Flatpak Repo]
          Version=1
          Url=https://boze46.github.io/siyuan-patch-flatpak/repo
          Title=SiYuan Patch
          Comment=Community-patched SiYuan builds
          Description=Self-built flatpak repo for MohamedElashri/siyuan-patch
          DefaultBranch=master
          EOF

      - name: Upload Pages artifact
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
